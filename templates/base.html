{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Encontre e compartilhe livros e filmes em domínio público ou legalmente livres para distribuição. Preservando a cultura e o acesso ao conhecimento.">

    <title>Livre Aqui! {% block title %}{% endblock title %}</title>

    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>

<body class="bg-dark text-light">

    <header class="border-bottom border-secondary">

        <nav class="navbar navbar-expand-lg navbar-dark bg-black">
            <div class="container">

                <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'catalog:home' %}">
                    <img src="{% static 'images/icon.png' %}" alt="" class="img-fluid" style="height: 2rem;">
                    <span class="fw-bold">Livre Aqui!</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">
                    
                    <ul class="navbar-nav ms-auto">
                        
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'movie:movie_search' %}">
                                Filmes
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'ebook:ebook_search' %}">
                                Livros
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'catalog:about' %}">
                                Sobre o projeto
                            </a>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>


        <img class="img-fluid w-100" src="{% static 'images/hero.jpg' %}"
            alt="Imagem com a lua do filme Viagem à Lua de 1902 em preto e branco.">


    </header>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-9 col-xl-8">

                {% block main %}
                {% endblock %}

            </div>

        </div>

    </main>


    <footer class="bg-black border-top border-secondary py-5">

        <div class="container text-center">

            <p class="mb-1">
                © 2026 Livre Aqui!
            </p>

            <p class="text-secondary mb-4">
                Compartilhando cultura de forma legal.
            </p>

            <address class="mb-3">

                Contato:
                <a class="link-light text-decoration-none" href="mailto:robam.817@gmail.com">
                    robam.817@gmail.com
                </a>

            </address>

            <small class="text-secondary">

                <a class="link-secondary" href="https://www.flaticon.com/br/icones-gratis/retro">

                    Retro ícones criados por Magnific - Flaticon

                </a>

            </small>

        </div>

    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/htmx.min.js' %}"></script>

</body>

</html>
